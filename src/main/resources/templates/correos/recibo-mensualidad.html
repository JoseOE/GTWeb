<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{correos/base :: correo('Tu recibo de membresía', ~{::#cuerpo})}">
<body>
<div id="cuerpo">
    <p style="margin:0 0 16px;" th:text="|${saludo}:|">Hola, Juan:</p>
    <p style="margin:0 0 20px;" th:text="|${gimnasio} registró tu pago de ${monto} por ${concepto}.|">Registramos tu pago.</p>
    <p style="margin:0 0 20px;" th:if="${!#strings.isEmpty(cubreHasta)}" th:text="|Tu membresía queda cubierta hasta el ${cubreHasta}.|">Tu membresía queda cubierta.</p>
    <p style="margin:0 0 20px;">Te dejamos el recibo en PDF.</p>
    <p style="margin:0;font-size:12px;color:#62645d;">Comprobante simulado, sin validez fiscal.</p>
</div>
</body>
</html>
