<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{correos/base :: correo('Recibimos tu pago', ~{::#cuerpo})}">
<body>
<div id="cuerpo">
    <p style="margin:0 0 16px;" th:text="|${saludo}:|">Hola, Juan:</p>
    <p style="margin:0 0 20px;" th:text="|${gimnasio} recibió tu pago en efectivo de $${#numbers.formatDecimal(pedido['total'], 1, 'COMMA', 2, 'POINT')} por el pedido #${pedido['folio']}. Te dejamos el recibo en PDF.|">Recibimos tu pago.</p>
    <p style="margin:0 0 24px;">Ya puedes pasar a recogerlo a la recepción. Si incluía un plan, tu membresía ya está activa.</p>
    <p style="margin:0 0 24px;">
        <a th:href="${enlace}" href="#" style="display:inline-block;padding:14px 24px;background-color:#f45124;color:#191b18;border-radius:4px;font-weight:700;text-decoration:none;">Ver mi pedido</a>
    </p>
    <p style="margin:0;font-size:12px;color:#62645d;">Comprobante simulado, sin validez fiscal.</p>
</div>
</body>
</html>
