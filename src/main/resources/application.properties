# ─── Conexión a MongoDB Atlas ───
# La URI (con usuario y contraseña) NO vive aquí: se lee de la variable MONGODB_URI.
#
#  - En tu computadora: ponla en un archivo .env en la raíz del proyecto
#    (copia .env.example y rellénalo). Ese archivo está en .gitignore y nunca se sube a GitHub.
#  - En un hosting (Render, Railway...): defínela como variable de entorno.
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ─── Correos de la cuenta (verificación, recuperación y avisos) ───
# Se envían por el SMTP de Gmail con la cuenta de GymTrack. El correo y la
# contraseña de aplicación van en el .env (MAIL_USERNAME, MAIL_PASSWORD), nunca aquí.
# Sin esos datos la página funciona igual: los códigos se escriben en la consola.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Dirección con la que se arman los enlaces de los correos (cámbiala al publicar la página).
app.url-publica=${APP_URL:http://localhost:8080}

# Configuración del servidor
# Render (y la mayoría de hostings) asignan el puerto por la variable PORT;
# en tu computadora, sin esa variable, sigue usando 8080.
server.port=${PORT:8080}
