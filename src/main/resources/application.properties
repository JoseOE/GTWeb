# ─── Conexión a MongoDB Atlas ───
# La URI (con usuario y contraseña) NO vive aquí: se lee de la variable MONGODB_URI.
#
#  - En tu computadora: ponla en un archivo .env en la raíz del proyecto
#    (copia .env.example y rellénalo). Ese archivo está en .gitignore y nunca se sube a GitHub.
#  - En un hosting (Render, Railway...): defínela como variable de entorno.
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ─── Correos de la cuenta (verificación, recuperación y avisos) ───
# Se envían por la API HTTP de Brevo (api.brevo.com), no por SMTP: Render
# bloquea los puertos SMTP salientes en todos sus planes. BREVO_API_KEY sale
# de tu cuenta de Brevo (SMTP & API > API Keys); MAIL_USERNAME debe ser un
# remitente verificado ahí (Senders, Domains & Dedicated IPs). Van en el .env,
# nunca aquí. Sin esos datos la página funciona igual: los códigos se
# escriben en la consola.
brevo.api-key=${BREVO_API_KEY:}
brevo.remitente=${MAIL_USERNAME:}
# Dirección con la que se arman los enlaces de los correos (cámbiala al publicar la página).
app.url-publica=${APP_URL:http://localhost:8080}

# Configuración del servidor
# Render (y la mayoría de hostings) asignan el puerto por la variable PORT;
# en tu computadora, sin esa variable, sigue usando 8080.
server.port=${PORT:8080}

# Sesión con token (ver SesionFilter). Mientras la app móvil no mande el token,
# EXIGIR_TOKEN=false deja que sus rutas sigan aceptando X-User-Id; el panel de la
# página exige token siempre. Cámbialo a true en cuanto la app lo mande.
seguridad.exigir-token=${EXIGIR_TOKEN:false}
# La web siempre pide aceptar los términos de compra antes de pagar. La app
# todavía no los manda: true en cuanto GTApp se actualice.
tienda.exigir-consentimiento-app=${EXIGIR_CONSENTIMIENTO_APP:false}

# ─── Pagos ───
# sandbox: las APIs reales en su modo de pruebas (Stripe Checkout, PayPal y la
# ficha de Paynet de Openpay). simulado: los simuladores internos, sin llaves;
# solo para las pruebas automáticas del CI. Las llaves van en el .env o en las
# variables de entorno del hosting, nunca aquí.
pagos.modo=${PAGOS_MODO:simulado}
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.modo=${PAYPAL_MODO:sandbox}
openpay.merchant-id=${OPENPAY_MERCHANT_ID:}
openpay.private-key=${OPENPAY_PRIVATE_KEY:}
openpay.public-key=${OPENPAY_PUBLIC_KEY:}
openpay.modo=${OPENPAY_MODO:sandbox}
