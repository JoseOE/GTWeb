<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Algo falló | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="/css/fonts.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/error.css">
    <script src="/js/tema-error.js"></script>
</head>
<body>
    <header class="error-barra">
        <a class="error-marca" href="/" aria-label="GymTrack, ir al inicio">
            <i class="bx bx-dumbbell" aria-hidden="true"></i><span>Gym<span>Track</span></span>
        </a>
    </header>
    <main class="error-cuerpo">
        <div class="error-tarjeta">
            <p class="error-codigo" aria-hidden="true">500</p>
            <h1 class="error-titulo">Algo falló de nuestro lado</h1>
            <p class="error-texto">No es tu culpa: tuvimos un problema al cargar esta página. Inténtalo de nuevo en un momento; tus datos están a salvo.</p>
            <div class="error-acciones">
                <button type="button" class="error-boton es-principal" onclick="location.reload()"><i class="bx bx-refresh" aria-hidden="true"></i> Intentar de nuevo</button>
                <a class="error-boton es-secundario" href="/"><i class="bx bx-home-alt" aria-hidden="true"></i> Ir al inicio</a>
            </div>
        </div>
    </main>
    <footer class="error-pie">¿Sigue pasando? <a href="/contacto.html">Avísanos</a></footer>
</body>
</html>
