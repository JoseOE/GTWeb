<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <title>Simulador PayPal | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/pagos/paypal-sim.css">
</head>
<!--
    Simulador PayPal: aquí se aprueba o se cancela un pago de prueba de la
    tienda. Se ve como la ventana de PayPal (sus colores y su logotipo), pero
    lleva la marca "Simulación" a la vista, no pide contraseña y no cobra.
    Se abre desde el checkout de la web o desde el navegador de la app (que no
    tiene la sesión de la página): el id de la orden en la URL hace de llave.
    Al terminar regresa a la dirección que dio quien creó la orden.
-->
<body class="pp-pagina">

    <div class="pp-aviso-sim" role="note">
        <i class="bx bx-info-circle" aria-hidden="true"></i>
        Simulación de PayPal para pruebas · No es PayPal y no cobra dinero real
    </div>

    <header class="pp-barra">
        <div class="pp-barra-contenido">
            <img class="pp-logo" src="img/pagos/paypal.svg" alt="PayPal" width="96" height="32">
            <span class="pp-simulacion">Simulación</span>
            <span class="pp-carrito" id="pp-carrito" hidden>
                <i class="bx bx-cart" aria-hidden="true"></i>
                <span id="pp-carrito-monto"></span>
            </span>
        </div>
    </header>

    <main class="pp-principal" id="orden" aria-live="polite">
        <div class="pp-tarjeta" aria-hidden="true"><div class="placeholder-glow"><span class="placeholder col-5"></span><br><span class="placeholder col-8 placeholder-lg"></span></div></div>
    </main>

    <footer class="pp-pie">
        <img src="img/pagos/paypal.svg" alt="" width="60" height="20">
        <p class="mb-0">Esta página simula la aprobación de un pago de PayPal para las pruebas de GymTrack.
            No es PayPal, no pide contraseñas y no cobra dinero real.</p>
    </footer>

    <script>
        (function () {
            const raiz = document.getElementById('orden');
            const token = new URLSearchParams(location.search).get('token') || '';

            function escapar(s) {
                const div = document.createElement('div');
                div.textContent = s == null ? '' : String(s);
                return div.innerHTML;
            }

            function dinero(n) {
                return '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // "Ana Compradora" → "AC"; un correo → su primera letra.
            function iniciales(texto) {
                const partes = String(texto || '').replace(/\(.*\)/, '').trim().split(/\s+/).filter(Boolean);
                return (partes.slice(0, 2).map(p => p[0]).join('') || '?').toUpperCase();
            }

            function api(ruta, opciones) {
                return fetch('/api/simuladores/paypal/ordenes/' + encodeURIComponent(token) + ruta,
                        Object.assign({ headers: { 'Content-Type': 'application/json' } }, opciones))
                    .then(res => res.json().catch(() => ({})).then(cuerpo => {
                        if (!res.ok) throw new Error(cuerpo.error || 'No se pudo completar la operación. Intenta de nuevo.');
                        return cuerpo;
                    }));
            }

            // Pantallas de una sola acción: pago ya aprobado, cancelado, usado o no encontrado.
            function pintarEstado(icono, titulo, texto, accion, tono) {
                raiz.innerHTML = `
                    <section class="pp-tarjeta pp-estado${tono ? ' pp-estado-' + tono : ''}">
                        <span class="pp-estado-icono"><i class="bx ${icono}" aria-hidden="true"></i></span>
                        <h1 class="pp-titulo mt-3">${escapar(titulo)}</h1>
                        <p class="pp-texto mb-0">${escapar(texto)}</p>
                        ${accion ? '<a class="pp-boton mt-4" href="' + escapar(accion.url) + '">' + escapar(accion.texto) + '</a>' : ''}
                    </section>`;
            }

            function pintar(orden) {
                const carrito = document.getElementById('pp-carrito');
                document.getElementById('pp-carrito-monto').textContent = dinero(orden.monto) + ' ' + (orden.moneda || '');
                carrito.hidden = false;

                if (orden.estado === 'aprobada') {
                    return pintarEstado('bx-check', 'Ya aprobaste este pago', 'Lo aprobaste con ' + orden.cuenta + '.',
                        orden.regreso && { texto: 'Volver a la tienda', url: orden.regreso }, 'ok');
                }
                if (orden.estado === 'cancelada') {
                    return pintarEstado('bx-x', 'Cancelaste este pago', 'No se cobró nada.',
                        orden.regreso && { texto: 'Volver a la tienda', url: orden.regreso });
                }
                if (orden.estado === 'usada') {
                    return pintarEstado('bx-check-double', 'Este pago ya se completó', 'Ya puedes cerrar esta página.', null, 'ok');
                }
                const articulos = orden.articulos === 1 ? '1 artículo' : orden.articulos + ' artículos';
                const textoAprobar = (orden.recordar ? 'Aprobar, vincular y pagar ' : 'Aprobar y pagar ') + dinero(orden.monto);
                raiz.innerHTML = `
                    <h1 class="pp-titulo">Paga con PayPal</h1>
                    <p class="pp-texto">Elige con qué cuenta de prueba quieres pagar. Al aprobar regresas a la tienda para terminar tu compra.</p>

                    <section class="pp-resumen" aria-labelledby="pp-comercio">
                        <div class="pp-resumen-fila">
                            <div class="min-w-0">
                                <div class="pp-etiqueta">Pagar a</div>
                                <div class="pp-comercio" id="pp-comercio">${escapar(orden.comercio)}</div>
                            </div>
                            <div class="text-end">
                                <div class="pp-monto">${dinero(orden.monto)}</div>
                                <div class="pp-etiqueta">${escapar(orden.moneda)}</div>
                            </div>
                        </div>
                        <div class="pp-resumen-pie">${articulos} · orden <span class="pp-orden">${escapar(orden.id)}</span></div>
                    </section>

                    <form class="pp-tarjeta mt-3" id="pp-form" novalidate>
                        <fieldset>
                            <legend class="pp-legenda">Paga con</legend>
                            ${orden.cuentas.map((c, i) => `
                                <label class="pp-cuenta">
                                    <input type="radio" name="cuenta" value="${escapar(c.correo)}" ${i === 0 ? 'checked' : ''}>
                                    <span class="pp-avatar" aria-hidden="true">${escapar(iniciales(c.nombre))}</span>
                                    <span class="min-w-0"><span class="pp-cuenta-nombre">${escapar(c.nombre)}</span><small>${escapar(c.correo)}</small></span>
                                </label>`).join('')}
                            <label class="pp-cuenta">
                                <input type="radio" name="cuenta" value="otra">
                                <span class="pp-avatar pp-avatar-otra" aria-hidden="true"><i class="bx bx-plus"></i></span>
                                <span class="min-w-0"><span class="pp-cuenta-nombre">Otra cuenta</span><small>Escribe cualquier correo de prueba</small></span>
                            </label>
                            <input type="email" class="form-control pp-campo d-none" id="pp-otra" placeholder="correo@ejemplo.com"
                                   autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Correo de la cuenta de prueba">
                        </fieldset>
                        <p class="pp-nota"><i class="bx bx-lock-alt" aria-hidden="true"></i>
                            No se pide contraseña: es una simulación. No escribas datos de tu cuenta real.</p>
                        ${orden.recordar ? '<p class="pp-vinculo-aviso"><i class="bx bx-link" aria-hidden="true"></i><span>Al aprobar, esta cuenta queda <strong>vinculada a ' + escapar(orden.comercio) + '</strong>: tus siguientes compras se pagan con solo confirmar, sin volver aquí. La puedes quitar cuando quieras en Mi cuenta.</span></p>' : ''}
                        <div class="alert alert-danger small py-2 d-none" id="pp-error" role="alert"></div>
                        <button type="submit" class="pp-boton" id="pp-aprobar">${textoAprobar}</button>
                        <button type="button" class="pp-boton-secundario" id="pp-cancelar">Cancelar y volver a la tienda</button>
                    </form>`;

                const form = document.getElementById('pp-form');
                const otra = document.getElementById('pp-otra');
                const error = document.getElementById('pp-error');
                const botones = [document.getElementById('pp-aprobar'), document.getElementById('pp-cancelar')];

                form.addEventListener('change', () => {
                    const elegida = form.querySelector('input[name="cuenta"]:checked').value;
                    otra.classList.toggle('d-none', elegida !== 'otra');
                    if (elegida === 'otra') otra.focus();
                });

                function ocupado(si, texto) {
                    botones.forEach(b => { b.disabled = si; });
                    if (texto) botones[0].innerHTML = texto;
                }

                function fallo(err) {
                    error.textContent = err.message;
                    error.classList.remove('d-none');
                    ocupado(false, textoAprobar);
                }

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    error.classList.add('d-none');
                    const elegida = form.querySelector('input[name="cuenta"]:checked').value;
                    const cuenta = elegida === 'otra' ? otra.value.trim() : elegida;
                    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(cuenta)) {
                        return fallo(new Error('Escribe el correo de una cuenta de prueba.'));
                    }
                    ocupado(true, '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Aprobando…');
                    api('/aprobar', { method: 'POST', body: JSON.stringify({ cuenta }) })
                        .then(r => {
                            pintarEstado('bx-check', 'Pago aprobado', 'Regresando a ' + orden.comercio + ' para terminar la compra…',
                                { texto: 'Volver a la tienda', url: r.redirect }, 'ok');
                            location.href = r.redirect;
                        })
                        .catch(fallo);
                });

                document.getElementById('pp-cancelar').addEventListener('click', () => {
                    error.classList.add('d-none');
                    ocupado(true);
                    api('/cancelar', { method: 'POST' })
                        .then(r => { location.href = r.redirect; })
                        .catch(fallo);
                });
            }

            if (!token) {
                pintarEstado('bx-error', 'Falta la orden de pago', 'Vuelve a la tienda e inténtalo de nuevo.', { texto: 'Ir a la tienda', url: 'tienda.html' });
                return;
            }
            api('', { method: 'GET' })
                .then(pintar)
                .catch(err => pintarEstado('bx-error', 'No encontramos este pago', err.message, { texto: 'Ir a la tienda', url: 'tienda.html' }));
        })();
    </script>
</body>
</html>
