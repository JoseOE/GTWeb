<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi cuenta | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editorial.css">
</head>
<body class="gym-interior bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a href="bienvenido.html" class="btn btn-outline-light btn-sm rounded-pill px-3 d-inline-flex align-items-center gap-1"><i class='bx bx-grid-alt'></i> <span class="d-none d-sm-inline">Panel</span></a>
                <a href="login.html" class="btn btn-outline-danger btn-sm rounded-pill px-3" id="btn-salir">
                    <i class='bx bx-log-out'></i> <span class="d-none d-sm-inline">Cerrar Sesión</span>
                </a>
            </div>
        </div>
    </nav>

    <section class="flex-grow-1 py-5 auth-shell">
        <div class="container" style="max-width:1000px">
            <div class="mb-4 page-fade-in">
                <h2 class="fw-bold font-display mb-2">Mi <span class="text-primary">cuenta</span></h2>
                <p class="text-body-secondary mb-0">
                    <span id="cuenta-nombre" class="fw-semibold text-body"></span>
                    <span id="cuenta-email"></span>
                    <span id="cuenta-verificado" class="badge rounded-pill ms-1 d-none"></span>
                </p>
            </div>

            <div class="row g-4">
                <!-- Cambiar contraseña -->
                <div class="col-lg-6 page-fade-in delay-1">
                    <div class="card auth-card border-0 shadow-lg rounded-4 p-4 h-100">
                        <h3 class="fw-bold fs-5 mb-1"><i class='bx bx-lock-alt text-primary'></i> Cambiar contraseña</h3>
                        <p class="text-body-secondary small">Te avisaremos por correo cuando cambie.</p>
                        <form id="form-contrasena">
                            <div class="mb-3">
                                <label for="pw-actual" class="form-label fw-semibold small">Contraseña actual</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="pw-actual" autocomplete="current-password" required>
                                    <button class="input-group-text bg-body-tertiary border-start-0 btn" type="button" id="toggle-actual" aria-label="Mostrar u ocultar contraseña"><i class='bx bx-hide text-body-secondary'></i></button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="pw-nueva" class="form-label fw-semibold small">Contraseña nueva</label>
                                <div class="input-group">
                                    <input type="password" class="form-control border-end-0" id="pw-nueva" autocomplete="new-password" required>
                                    <button class="input-group-text bg-body-tertiary border-start-0 btn" type="button" id="toggle-nueva" aria-label="Mostrar u ocultar contraseña"><i class='bx bx-hide text-body-secondary'></i></button>
                                </div>
                                <div class="mt-2 small" id="requisitos"></div>
                            </div>
                            <div class="mb-3">
                                <label for="pw-confirmar" class="form-label fw-semibold small">Confirmar contraseña nueva</label>
                                <input type="password" class="form-control" id="pw-confirmar" autocomplete="new-password" required>
                            </div>
                            <div id="alerta-contrasena" class="alert d-none" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold" id="btn-contrasena">Guardar contraseña</button>
                        </form>
                    </div>
                </div>

                <!-- Cambiar correo -->
                <div class="col-lg-6 page-fade-in delay-2">
                    <div class="card auth-card border-0 shadow-lg rounded-4 p-4 h-100">
                        <h3 class="fw-bold fs-5 mb-1"><i class='bx bx-envelope text-primary'></i> Cambiar correo</h3>
                        <p class="text-body-secondary small">Te mandaremos un código al correo nuevo para confirmar que es tuyo.</p>

                        <form id="form-correo">
                            <div class="mb-3">
                                <label for="correo-nuevo" class="form-label fw-semibold small">Correo nuevo</label>
                                <input type="email" class="form-control" id="correo-nuevo" autocomplete="email" placeholder="ejemplo@correo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo-pw" class="form-label fw-semibold small">Tu contraseña</label>
                                <input type="password" class="form-control" id="correo-pw" autocomplete="current-password" required>
                            </div>
                            <div id="alerta-correo" class="alert d-none" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold" id="btn-correo">Enviar código</button>
                        </form>

                        <form id="form-codigo" class="d-none">
                            <p class="small mb-3">Escribe el código que enviamos a <strong id="correo-destino"></strong>.</p>
                            <div class="mb-3">
                                <label for="codigo" class="form-label fw-semibold small">Código de 6 dígitos</label>
                                <input type="text" class="form-control form-control-lg text-center fw-bold" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="letter-spacing:.5em" required>
                            </div>
                            <div id="alerta-codigo" class="alert d-none" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold" id="btn-codigo">Confirmar correo</button>
                            <button type="button" class="btn btn-link btn-sm w-100 mt-2 text-decoration-none" id="btn-otro-correo">Usar otro correo</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/cuenta.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        // Protección de ruta: sin sesión, al login.
        if (!userId) window.location.href = 'login.html';

        document.getElementById('btn-salir').addEventListener('click', () => {
            ['userName', 'userId', 'gymId'].forEach(k => localStorage.removeItem(k));
        });

        function pintarCuenta(cuenta) {
            document.getElementById('cuenta-nombre').textContent = cuenta.nombre || '';
            document.getElementById('cuenta-email').textContent = cuenta.email ? '· ' + cuenta.email : '';
            const badge = document.getElementById('cuenta-verificado');
            if (cuenta.emailVerificado === true) {
                badge.className = 'badge rounded-pill ms-1 text-bg-success';
                badge.textContent = 'Correo verificado';
            } else {
                badge.className = 'badge rounded-pill ms-1 d-none';
            }
        }

        if (userId) {
            fetch('/api/users/' + encodeURIComponent(userId) + '/me')
                .then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(pintarCuenta)
                .catch(status => { if (status === 404) window.location.href = 'login.html'; });
        }

        /* ─── Cambiar contraseña ─── */
        const formPw = document.getElementById('form-contrasena');
        const pwActual = document.getElementById('pw-actual');
        const pwNueva = document.getElementById('pw-nueva');
        const pwConfirmar = document.getElementById('pw-confirmar');
        const alertaPw = document.getElementById('alerta-contrasena');
        const btnPw = document.getElementById('btn-contrasena');

        vigilarRequisitos(pwNueva, document.getElementById('requisitos'));
        alternarVisibilidad(document.getElementById('toggle-actual'), pwActual);
        alternarVisibilidad(document.getElementById('toggle-nueva'), pwNueva);

        formPw.addEventListener('submit', (e) => {
            e.preventDefault();
            ocultarAlerta(alertaPw);
            if (!contrasenaSegura(pwNueva.value)) {
                mostrarAlerta(alertaPw, 'danger', 'La contraseña nueva no cumple los requisitos de seguridad.');
                return;
            }
            if (pwNueva.value !== pwConfirmar.value) {
                mostrarAlerta(alertaPw, 'danger', 'Las contraseñas nuevas no coinciden.');
                return;
            }
            botonCargando(btnPw, true, 'Guardando...');
            enviarJSON('/api/cuenta/contrasena', { userId, actual: pwActual.value, nueva: pwNueva.value }).then(r => {
                botonCargando(btnPw, false);
                if (r.ok) {
                    formPw.reset();
                    pwNueva.dispatchEvent(new Event('input'));
                    mostrarAlerta(alertaPw, 'success', r.body.message);
                } else {
                    mostrarAlerta(alertaPw, 'danger', r.body.error || 'No pudimos cambiar la contraseña.');
                }
            });
        });

        /* ─── Cambiar correo (dos pasos) ─── */
        const formCorreo = document.getElementById('form-correo');
        const formCodigo = document.getElementById('form-codigo');
        const correoNuevo = document.getElementById('correo-nuevo');
        const codigo = document.getElementById('codigo');
        const alertaCorreo = document.getElementById('alerta-correo');
        const alertaCodigo = document.getElementById('alerta-codigo');

        codigo.addEventListener('input', () => { codigo.value = codigo.value.replace(/\D/g, '').slice(0, 6); });

        formCorreo.addEventListener('submit', (e) => {
            e.preventDefault();
            ocultarAlerta(alertaCorreo);
            const btn = document.getElementById('btn-correo');
            botonCargando(btn, true, 'Enviando...');
            enviarJSON('/api/cuenta/correo', {
                userId, password: document.getElementById('correo-pw').value, nuevoCorreo: correoNuevo.value.trim()
            }).then(r => {
                botonCargando(btn, false);
                if (!r.ok) {
                    mostrarAlerta(alertaCorreo, 'danger', r.body.error || 'No pudimos enviar el código.');
                    return;
                }
                document.getElementById('correo-destino').textContent = correoNuevo.value.trim();
                formCorreo.classList.add('d-none');
                formCodigo.classList.remove('d-none');
                mostrarAlerta(alertaCodigo, 'success', r.body.message);
                codigo.focus();
            });
        });

        formCodigo.addEventListener('submit', (e) => {
            e.preventDefault();
            ocultarAlerta(alertaCodigo);
            const btn = document.getElementById('btn-codigo');
            botonCargando(btn, true, 'Confirmando...');
            enviarJSON('/api/cuenta/correo/confirmar', { userId, codigo: codigo.value.trim() }).then(r => {
                botonCargando(btn, false);
                if (!r.ok) {
                    mostrarAlerta(alertaCodigo, 'danger', r.body.error || 'No pudimos confirmar el código.');
                    return;
                }
                pintarCuenta({
                    nombre: document.getElementById('cuenta-nombre').textContent,
                    email: r.body.email,
                    emailVerificado: true
                });
                formCodigo.reset();
                formCorreo.reset();
                formCodigo.classList.add('d-none');
                formCorreo.classList.remove('d-none');
                mostrarAlerta(alertaCorreo, 'success', r.body.message);
            });
        });

        document.getElementById('btn-otro-correo').addEventListener('click', () => {
            formCodigo.reset();
            ocultarAlerta(alertaCodigo);
            formCodigo.classList.add('d-none');
            formCorreo.classList.remove('d-none');
            correoNuevo.focus();
        });
    </script>
</body>
</html>
