<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#20221f">
    <title>Pedido | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editorial.css">
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body class="gym-interior tienda">

    <header id="tienda-barra"></header>

    <main class="container-tienda py-4" id="contenido" style="max-width:640px">
        <div id="pedido">
            <div class="esqueleto mx-auto mb-3" style="width:84px;height:84px;border-radius:50%" aria-hidden="true"></div>
            <div class="esqueleto mb-3" style="height:60px" aria-hidden="true"></div>
            <div class="esqueleto" style="height:200px" aria-hidden="true"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tienda.js"></script>
    <script src="js/pagos/metodos.js"></script>
    <script>
        (function () {
            Tienda.exigirSesion();
            Tienda.montar();

            const raiz = document.getElementById('pedido');
            const orderId = new URLSearchParams(location.search).get('pedido');
            if (!orderId) {
                Tienda.pintarEstado(raiz, 'vacio', 'No encontramos ese pedido.');
                return;
            }

            const ENCABEZADOS = {
                pagado: { titulo: '¡Listo! Tu pedido está pagado', texto: 'Pasa a recogerlo a la recepción de tu gimnasio.' },
                pendiente_pago: { titulo: 'Tu pedido está apartado', texto: 'Lo entregamos en cuanto se confirme tu pago.' },
                cancelado: { titulo: 'Este pedido se canceló', texto: 'No se te cobró nada.' },
                reembolsado: { titulo: 'Este pedido se reembolsó', texto: 'Te devolvimos el importe por el mismo medio de pago.' }
            };

            function icono(estado) {
                if (estado === 'pagado') {
                    return '<svg class="check-enviado" viewBox="0 0 72 72" width="84" height="84" aria-hidden="true">'
                        + '<circle class="check-circulo" cx="36" cy="36" r="32" fill="none" stroke="#f45124" stroke-width="4"></circle>'
                        + '<path class="check-palomita" d="M22 37.5 32 47.5 51 27" fill="none" stroke="#f45124" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
                }
                const i = estado === 'pendiente_pago' ? 'bx-time-five' : 'bx-x-circle';
                return '<i class="bx ' + i + ' d-block text-center" style="font-size:84px;color:var(--brand-dark)" aria-hidden="true"></i>';
            }

            function pintar(p, cuenta) {
                const enc = ENCABEZADOS[p.estado] || { titulo: 'Pedido #' + p.folio, texto: '' };
                const conPlan = p.partidas.some(x => x.tipo === 'membresia');
                const gym = p.gym || {};
                raiz.innerHTML = `
                    <div class="text-center">
                        ${icono(p.estado)}
                        <h1 class="seccion-titulo fs-3 mt-3">${Tienda.escapar(enc.titulo)}</h1>
                        <p class="text-body-secondary mb-1">${Tienda.escapar(enc.texto)}</p>
                        <div class="titulo-display mt-2">Pedido #${Tienda.escapar(p.folio)}</div>
                        <span class="estado-pedido ${Tienda.escapar(p.estado)} mt-2">${Tienda.escapar(p.estadoTexto)}</span>
                    </div>
                    ${conPlan && p.estado === 'pagado' && cuenta && cuenta.fechaProximoPago
                        ? '<div class="aviso-despertando mt-4" role="status"><i class="bx bx-check-circle fs-4 text-success" aria-hidden="true"></i><span>Tu membresía quedó activa hasta el <strong>' + Tienda.fecha(cuenta.fechaProximoPago + 'T12:00:00') + '</strong>.</span></div>'
                        : ''}
                    <section class="paso mt-4">
                        <div class="d-flex justify-content-between gap-3 small text-body-secondary mb-2">
                            <span>${Tienda.escapar(Tienda.fecha(p.creadoEn))}</span><span>${Tienda.escapar(p.metodo)}</span>
                        </div>
                        ${p.partidas.map(x => `
                            <div class="d-flex justify-content-between gap-3 py-1">
                                <span style="min-width:0"><span class="fw-semibold">${x.cantidad} × ${Tienda.escapar(x.titulo)}</span>
                                ${x.variante ? '<br><small class="text-body-secondary">' + Tienda.escapar(x.variante) + '</small>' : ''}</span>
                                <span class="fw-semibold text-nowrap">${Tienda.dinero(x.total)}</span>
                            </div>`).join('')}
                        <div class="totales mt-2">
                            <div class="fila text-body-secondary"><span>Subtotal (sin IVA)</span><span>${Tienda.dinero(p.subtotal)}</span></div>
                            <div class="fila text-body-secondary"><span>IVA 16 %</span><span>${Tienda.dinero(p.iva)}</span></div>
                            <div class="fila total"><span>Total</span><span>${Tienda.dinero(p.total)}</span></div>
                        </div>
                        <div class="d-flex gap-2 mt-3 small">
                            <i class="bx bx-store-alt fs-5 text-primary" aria-hidden="true"></i>
                            <span>Recoger en <strong>${Tienda.escapar(gym.nombre || 'tu gimnasio')}</strong>${gym.direccion ? '<br><span class="text-body-secondary">' + Tienda.escapar(gym.direccion) + '</span>' : ''}</span>
                        </div>
                    </section>
                    <div id="detalle-metodo" class="mt-3"></div>
                    <div class="d-grid gap-2 mt-4">
                        ${p.estado === 'pagado' || p.estado === 'reembolsado' ? '<button type="button" class="btn btn-primary btn-grande" id="recibo"><i class="bx bx-download"></i> Descargar recibo</button>' : ''}
                        ${p.estado === 'pendiente_pago' ? '<button type="button" class="btn btn-primary btn-grande" id="actualizar"><i class="bx bx-refresh"></i> Ya pagué: actualizar estado</button>' : ''}
                        <a class="btn btn-outline-primary btn-grande" href="pedidos.html">Ver mis pedidos</a>
                        <a class="btn btn-link tocable" href="tienda.html">Seguir comprando</a>
                    </div>`;

                document.getElementById('recibo')?.addEventListener('click', (e) => Tienda.descargarRecibo(p.orderId, p.folio, e.currentTarget));
                document.getElementById('actualizar')?.addEventListener('click', (e) => {
                    e.currentTarget.disabled = true;
                    cargar(true);
                });

                // Lo propio del método (p. ej. la ficha de Paynet), si su módulo lo define.
                const id = MetodosPago.idDeProveedor(p.proveedorPago);
                if (id) {
                    MetodosPago.cargar().then(() => {
                        const metodo = MetodosPago.obtener(id);
                        if (metodo && metodo.confirmacion) metodo.confirmacion(document.getElementById('detalle-metodo'), p);
                    });
                }
            }

            function cargar(avisarSiSigue) {
                Promise.all([
                    Tienda.api('/api/tienda/pedidos/' + encodeURIComponent(orderId)),
                    Tienda.cuenta().catch(() => null)
                ])
                    .then(([p, cuenta]) => {
                        pintar(p, cuenta);
                        if (avisarSiSigue && p.estado === 'pendiente_pago') Tienda.avisar('Tu pago todavía no se refleja. Intenta en unos minutos.');
                    })
                    .catch(err => Tienda.pintarEstado(raiz, err.status === 404 ? 'vacio' : 'error', err.message,
                        err.status === 404 ? null : () => cargar()));
            }

            cargar();
            if (Tienda.sesion.role !== 'owner') Tienda.cargarCarrito().catch(() => {});
        })();
    </script>
</body>
</html>
