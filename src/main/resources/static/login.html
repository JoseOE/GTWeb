<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editorial.css">
</head>
<body class="gym-interior bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" aria-label="Volver al inicio" class="btn btn-outline-light rounded-pill px-3 d-flex align-items-center gap-1"><i class='bx bx-home-alt'></i> <span class="d-none d-sm-inline">Inicio</span></a>
                <a href="registro.html" class="btn btn-primary rounded-pill px-4">Crear Cuenta</a>
            </div>
        </div>
    </nav>

    <section class="flex-grow-1 d-flex align-items-center py-5 auth-shell">
        <div class="container">
            <div class="row justify-content-center align-items-center g-5">
                <div class="col-lg-5 d-none d-lg-block text-center page-fade-in">
                    <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?q=80&w=600&auto=format&fit=crop" class="img-fluid rounded-4 shadow-lg mb-4" alt="Login">
                    <h3 class="fw-bold font-display">Bienvenido de vuelta</h3>
                    <p class="text-body-secondary">Accede a tu panel de control para gestionar tu gimnasio.</p>
                </div>

                <div class="col-lg-5 page-fade-in delay-1">
                    <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="auth-icon-circle rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:60px;height:60px">
                                <i class='bx bx-log-in-circle text-primary fs-2'></i>
                            </div>
                            <h3 class="fw-bold">Iniciar Sesión</h3>
                            <p class="text-body-secondary small">Ingresa tus credenciales para continuar.</p>
                        </div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-envelope text-body-secondary'></i></span>
                                    <input type="email" class="form-control form-control-lg rounded-end-3 border-start-0" id="email" autocomplete="email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold small">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-lock-alt text-body-secondary'></i></span>
                                    <input type="password" class="form-control form-control-lg border-start-0 border-end-0" id="password" autocomplete="current-password" required>
                                    <button class="input-group-text bg-body-tertiary border-start-0 btn" type="button" id="toggle-pw" aria-label="Mostrar u ocultar contraseña" title="Mostrar/Ocultar">
                                        <i class='bx bx-hide text-body-secondary' id="toggle-pw-icon"></i>
                                    </button>
                                </div>
                            </div>

                            <div id="alert-error" class="alert alert-danger d-none small py-2" role="alert"></div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm" id="btn-submit">
                                Entrar
                            </button>

                            <div class="text-center mt-4">
                                <span class="text-body-secondary small">¿Aún no tienes cuenta?</span>
                                <a href="registro.html" class="text-primary fw-semibold text-decoration-none small">Regístrate</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('toggle-pw').addEventListener('click', () => {
            const pw = document.getElementById('password');
            const icon = document.getElementById('toggle-pw-icon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('bx-hide', 'bx-show');
            } else {
                pw.type = 'password';
                icon.classList.replace('bx-show', 'bx-hide');
            }
        });

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const alertError = document.getElementById('alert-error');
            alertError.classList.add('d-none');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const btn = document.getElementById('btn-submit');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Entrando...';
            btn.disabled = true;

            fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json().then(data => ({ status: res.status, body: data })))
            .then(response => {
                if (response.status === 200) {
                    localStorage.setItem('userName', response.body.nombre);
                    localStorage.setItem('userId', response.body.id || '');
                    if (response.body.gymId) {
                        localStorage.setItem('gymId', response.body.gymId);
                    } else {
                        localStorage.removeItem('gymId');
                    }
                    window.location.href = 'bienvenido.html';
                } else {
                    alertError.innerHTML = '<i class="bx bx-error-circle"></i> ' + (response.body.error || 'Credenciales incorrectas.');
                    alertError.classList.remove('d-none');
                    btn.innerHTML = 'Entrar';
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alertError.innerHTML = '<i class="bx bx-error-circle"></i> Error de conexión con el servidor.';
                alertError.classList.remove('d-none');
                btn.innerHTML = 'Entrar';
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
