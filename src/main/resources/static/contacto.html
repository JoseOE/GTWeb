<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editorial.css">
    <!-- EmailJS: manda el formulario al Gmail del equipo sin pasar por el backend -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        if (window.emailjs) emailjs.init({ publicKey: "91tnidFbgPPknlkBX" });
    </script>
</head>
<body class="gym-interior bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" aria-label="Volver al inicio" class="btn btn-outline-light rounded-pill px-3 d-flex align-items-center gap-1"><i class='bx bx-home-alt'></i> <span class="d-none d-sm-inline">Inicio</span></a>
            </div>
        </div>
    </nav>

    <section class="flex-grow-1 d-flex align-items-center py-5 auth-shell">
        <div class="container">
            <div class="row justify-content-center align-items-center g-5">
                <!-- Columna izquierda: canales de contacto -->
                <div class="col-lg-5 page-fade-in">
                    <h2 class="fw-bold mb-4 font-display">¿Tienes dudas?<br><span class="text-primary">Estamos aquí para ti.</span></h2>
                    <p class="text-body-secondary fs-5 mb-4">Llena el formulario y un asesor se pondrá en contacto contigo para darte una demostración de GymTrack.</p>
                    <div class="d-flex flex-column gap-3">
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-circle icon-success rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:45px;height:45px">
                                <i class='bx bxl-whatsapp fs-4'></i>
                            </div>
                            <div>
                                <span class="d-block fw-semibold">WhatsApp directo</span>
                                <a href="https://wa.me/527721013839" target="_blank" rel="noopener noreferrer" class="text-body-secondary text-decoration-none">+52 772 101 3839</a>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div class="icon-circle icon-brand rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width:45px;height:45px">
                                <i class='bx bx-envelope fs-4'></i>
                            </div>
                            <div>
                                <span class="d-block fw-semibold">Correo electrónico</span>
                                <a href="mailto:josemariaortizescamilla@gmail.com" class="text-body-secondary text-decoration-none">josemariaortizescamilla@gmail.com</a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Columna derecha: formulario -->
                <div class="col-lg-5 page-fade-in delay-1">
                    <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="auth-icon-circle rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:60px;height:60px">
                                <i class='bx bx-chat text-primary fs-2'></i>
                            </div>
                            <h3 class="fw-bold">Contáctanos</h3>
                            <p class="text-body-secondary small">Te respondemos al correo que nos dejes.</p>
                        </div>

                        <!-- Los name (user_name, user_email, message) son las variables de la plantilla de EmailJS -->
                        <form id="contact-form">
                            <div class="mb-3">
                                <label for="user_name" class="form-label fw-semibold small">Nombre Completo</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-user text-body-secondary'></i></span>
                                    <input type="text" class="form-control form-control-lg rounded-end-3 border-start-0" id="user_name" name="user_name" autocomplete="name" placeholder="Ej. Juan Pérez" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="user_email" class="form-label fw-semibold small">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-envelope text-body-secondary'></i></span>
                                    <input type="email" class="form-control form-control-lg rounded-end-3 border-start-0" id="user_email" name="user_email" autocomplete="email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="message" class="form-label fw-semibold small">Mensaje</label>
                                <textarea class="form-control rounded-3" id="message" name="message" rows="5" placeholder="Cuéntanos sobre tu gimnasio o escribe tu duda…" required></textarea>
                            </div>

                            <div id="alert-success" class="alert alert-success d-none small py-2" role="status"></div>
                            <div id="alert-error" class="alert alert-danger d-none small py-2" role="alert"></div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm" id="btn-submit">
                                Enviar Mensaje <i class='bx bx-send ms-1'></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-submit');
            const alertSuccess = document.getElementById('alert-success');
            const alertError = document.getElementById('alert-error');
            const textoBoton = 'Enviar Mensaje <i class="bx bx-send ms-1"></i>';

            alertSuccess.classList.add('d-none');
            alertError.classList.add('d-none');

            const mostrarError = () => {
                alertError.innerHTML = '<i class="bx bx-error-circle"></i> Hubo un error al enviar el mensaje. Inténtalo más tarde o escríbenos por WhatsApp.';
                alertError.classList.remove('d-none');
                btn.innerHTML = textoBoton;
                btn.disabled = false;
            };

            // Si el script de EmailJS no cargó (sin internet o bloqueado), se avisa en vez de quedarse esperando.
            if (!window.emailjs) {
                mostrarError();
                return;
            }

            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Enviando...';
            btn.disabled = true;

            emailjs.sendForm('service_69aedda', 'template_36v663n', this)
                .then(() => {
                    alertSuccess.innerHTML = '<i class="bx bx-check-circle"></i> Mensaje enviado correctamente. Te contactaremos pronto.';
                    alertSuccess.classList.remove('d-none');
                    btn.innerHTML = textoBoton;
                    btn.disabled = false;
                    this.reset();
                }, mostrarError);
        });
    </script>
</body>
</html>
