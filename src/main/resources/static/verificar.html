<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar correo | GymTrack</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">
    <link rel="stylesheet" href="css/fonts.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/editorial.css">
</head>
<body class="gym-interior bg-body-tertiary d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3 d-flex align-items-center gap-2" href="index.html">
                <i class='bx bx-dumbbell text-primary fs-2'></i>
                <span>Gym<span class="text-primary">Track</span></span>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="index.html" aria-label="Volver al inicio" class="btn btn-outline-light rounded-pill px-3 d-flex align-items-center gap-1"><i class='bx bx-home-alt'></i> <span class="d-none d-sm-inline">Inicio</span></a>
                <a href="login.html" class="btn btn-outline-light rounded-pill px-4">Iniciar Sesión</a>
            </div>
        </div>
    </nav>

    <section class="flex-grow-1 d-flex align-items-center py-5 auth-shell">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5 page-fade-in">
                    <div class="card auth-card border-0 shadow-lg rounded-4 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="auth-icon-circle rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width:60px;height:60px">
                                <i class='bx bx-envelope-open text-primary fs-2'></i>
                            </div>
                            <h3 class="fw-bold">Verifica tu correo</h3>
                            <p class="text-body-secondary small mb-0">Escribe el código de 6 dígitos que te enviamos. Vence en 15 minutos.</p>
                        </div>

                        <form id="verify-form" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold small">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-body-tertiary border-end-0"><i class='bx bx-envelope text-body-secondary'></i></span>
                                    <input type="email" class="form-control form-control-lg rounded-end-3 border-start-0" id="email" autocomplete="email" placeholder="ejemplo@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="codigo" class="form-label fw-semibold small">Código de verificación</label>
                                <input type="text" class="form-control form-control-lg text-center fw-bold" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" style="letter-spacing:.5em" required>
                            </div>

                            <div id="alerta" class="alert d-none" role="alert"></div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm" id="btn-verificar">Verificar</button>

                            <div class="text-center mt-4 small">
                                <span class="text-body-secondary">¿No te llegó? Revisa tu carpeta de spam o</span>
                                <button type="button" class="btn btn-link btn-sm p-0 align-baseline fw-semibold text-decoration-none" id="btn-reenviar">reenvía el código</button>
                            </div>
                        </form>

                        <div id="verificado" class="text-center d-none">
                            <div id="alerta-final" class="alert alert-success small py-2" role="status"></div>
                            <a href="login.html" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">Iniciar sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/cuenta.js"></script>
    <script>
        const form = document.getElementById('verify-form');
        const emailInput = document.getElementById('email');
        const codigoInput = document.getElementById('codigo');
        const alerta = document.getElementById('alerta');
        const btnVerificar = document.getElementById('btn-verificar');
        const btnReenviar = document.getElementById('btn-reenviar');

        // registro.html y login.html dejan aquí el correo para no pedirlo otra vez.
        emailInput.value = sessionStorage.getItem('correoPorVerificar') || '';
        (emailInput.value ? codigoInput : emailInput).focus();

        function terminar(mensaje) {
            sessionStorage.removeItem('correoPorVerificar');
            form.classList.add('d-none');
            document.getElementById('verificado').classList.remove('d-none');
            document.getElementById('alerta-final').textContent = mensaje;
        }

        // Solo números en el código.
        codigoInput.addEventListener('input', () => {
            codigoInput.value = codigoInput.value.replace(/\D/g, '').slice(0, 6);
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            ocultarAlerta(alerta);
            const email = emailInput.value.trim();
            const codigo = codigoInput.value.trim();
            if (!email || codigo.length !== 6) {
                mostrarAlerta(alerta, 'danger', 'Escribe tu correo y el código de 6 dígitos.');
                return;
            }
            botonCargando(btnVerificar, true, 'Verificando...');
            enviarJSON('/api/cuenta/verificar', { email, codigo }).then(r => {
                botonCargando(btnVerificar, false);
                if (r.ok) terminar(r.body.message);
                else mostrarAlerta(alerta, 'danger', r.body.error || 'No pudimos verificar el código.');
            });
        });

        // Un reenvío por minuto: el botón muestra la cuenta regresiva.
        function esperarReenvio(segundos) {
            btnReenviar.disabled = true;
            const tick = () => {
                if (segundos <= 0) {
                    btnReenviar.textContent = 'reenvía el código';
                    btnReenviar.disabled = false;
                    return;
                }
                btnReenviar.textContent = 'reenvía en ' + segundos + ' s';
                segundos--;
                setTimeout(tick, 1000);
            };
            tick();
        }

        btnReenviar.addEventListener('click', () => {
            ocultarAlerta(alerta);
            const email = emailInput.value.trim();
            if (!email) {
                mostrarAlerta(alerta, 'danger', 'Escribe tu correo para reenviarte el código.');
                emailInput.focus();
                return;
            }
            btnReenviar.disabled = true;
            enviarJSON('/api/cuenta/verificar/reenviar', { email }).then(r => {
                if (r.ok) {
                    mostrarAlerta(alerta, 'success', r.body.message);
                    esperarReenvio(60);
                } else {
                    mostrarAlerta(alerta, 'danger', r.body.error || 'No pudimos reenviar el código.');
                    btnReenviar.disabled = false;
                }
            });
        });

        // El botón del correo trae ?token=...: se verifica solo al abrir la página.
        const token = new URLSearchParams(location.search).get('token');
        if (token) {
            history.replaceState(null, '', 'verificar.html');
            botonCargando(btnVerificar, true, 'Verificando...');
            enviarJSON('/api/cuenta/verificar', { token }).then(r => {
                botonCargando(btnVerificar, false);
                if (r.ok) terminar(r.body.message);
                else mostrarAlerta(alerta, 'danger', r.body.error || 'El enlace no es válido.');
            });
        }
    </script>
</body>
</html>
