# Dependabot revisa cada semana si hay versiones nuevas (sobre todo de
# seguridad) de lo que usa el proyecto y abre un PR con la actualización. El
# CI lo prueba como cualquier otro PR antes de mezclarlo (ISO 27001, A.12.6.1).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /pruebas
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
