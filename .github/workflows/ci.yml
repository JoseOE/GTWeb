# Revisión de cada PR antes de mezclarlo a main (y de cada cambio en main):
# compila Spring Boot y corre las pruebas de punta a punta contra Spring y un
# MongoDB de prueba. La tienda vive en Spring y MongoDB, así que no hace falta
# levantar nada más. Si algo falla, el PR lo muestra en rojo antes de que
# llegue a Render.
name: Revisión

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la revisión anterior.
concurrency:
  group: revision-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring:
    name: Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y empaquetar
        run: mvn -B -ntp package

  pruebas:
    name: Pruebas de punta a punta
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/gymtrackdb
      SPRING_LOG: ${{ github.workspace }}/pruebas/spring.log
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pruebas/package-lock.json

      - name: Revisar la sintaxis de los scripts
        run: for f in pruebas/*.mjs; do node --check "$f"; done

      - name: Empaquetar Spring
        run: mvn -B -ntp -DskipTests package

      # Los códigos de verificación salen en el log de Spring (no hay correo).
      - name: Levantar Spring
        run: |
          java -jar target/gymtrack-web-0.0.1-SNAPSHOT.jar > "$SPRING_LOG" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/tienda/estado > /dev/null && exit 0
            sleep 2
          done
          echo "Spring no arrancó"; tail -50 "$SPRING_LOG"; exit 1

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Correr las pruebas
        working-directory: pruebas
        run: node correr-todas.mjs

      - name: Log de Spring si algo falló
        if: failure()
        run: tail -200 "$SPRING_LOG"
