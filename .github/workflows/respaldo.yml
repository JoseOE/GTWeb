# Respaldo diario de la base de datos (ISO 27001, A.12.3.1).
#
# Saca una copia completa de MongoDB Atlas con mongodump, la cifra con
# AES-256 (la clave nunca sale de los secretos del repositorio) y la guarda
# 30 días como artefacto de esta ejecución. Cifrada, porque los artefactos los
# puede descargar cualquiera con acceso al repositorio.
#
# Necesita dos secretos (Settings → Secrets and variables → Actions):
#   MONGODB_URI     la misma cadena que usa Render
#   RESPALDO_CLAVE  una frase larga solo para cifrar los respaldos
# Sin ellos, el respaldo avisa y no hace nada. Cómo restaurar: docs/iso27001/06-operacion.md.
name: Respaldo

on:
  schedule:
    - cron: "0 9 * * *"   # 03:00 en Ciudad de México
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    name: Respaldo cifrado de MongoDB
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
    steps:
      - name: Revisar los secretos
        id: secretos
        run: |
          if [ -z "$MONGODB_URI" ] || [ -z "$RESPALDO_CLAVE" ]; then
            echo "::warning::Faltan los secretos MONGODB_URI o RESPALDO_CLAVE: no se hizo el respaldo."
            echo "listos=no" >> "$GITHUB_OUTPUT"
          else
            echo "listos=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Copiar la base (mongodump)
        if: steps.secretos.outputs.listos == 'si'
        run: |
          docker run --rm -e MONGODB_URI -v "$PWD:/salida" mongo:7 \
            sh -c 'mongodump --uri="$MONGODB_URI" --archive=/salida/gymtrack.archive --gzip'
          ls -lh gymtrack.archive

      - name: Cifrar (AES-256)
        if: steps.secretos.outputs.listos == 'si'
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in gymtrack.archive -out "gymtrack-$FECHA.archive.enc" -pass env:RESPALDO_CLAVE
          sha256sum "gymtrack-$FECHA.archive.enc" > "gymtrack-$FECHA.sha256"
          rm gymtrack.archive
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"

      - name: Guardar el respaldo (30 días)
        if: steps.secretos.outputs.listos == 'si'
        uses: actions/upload-artifact@v7
        with:
          name: respaldo-${{ env.FECHA }}
          path: |
            gymtrack-*.archive.enc
            gymtrack-*.sha256
          retention-days: 30
          if-no-files-found: error
